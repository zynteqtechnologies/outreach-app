<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outreach</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/outreach-logo.svg">
<link rel="alternate icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-title" content="Outreach">
<meta name="application-name" content="Outreach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ed;--card:#fff;--tx:#431407;--mu:#78513f;--ln:#f1dcc9;--ac:#c2410c;--tile:#ffe8d1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px 'DM Sans',system-ui,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.h{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.5px;margin:0}
.wrap{max-width:480px;margin:auto}
[hidden]{display:none!important}
section{display:none;padding:20px 16px 190px}
section.on{display:block}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rf{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rf svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rf.spin svg{animation:none}}
.mu{color:var(--mu);font-size:13px}
.tiles{display:flex;gap:8px;margin:14px 0 12px}
.tile{flex:1;background:var(--tile);border-radius:14px;padding:12px}
.tile b{display:block;font:600 28px Fraunces,Georgia,serif}
.tile span{font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.btn.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{flex:none;min-height:44px;padding:0 16px;font-weight:500;background:transparent;margin-top:10px;margin-right:8px}
.btn:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font:600 18px Fraunces,Georgia,serif;margin:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--card);padding:0 14px;font-size:16px}
select.in{cursor:pointer;appearance:auto;padding-right:28px}
textarea.in{padding:10px 14px;min-height:150px;line-height:1.5;margin-top:8px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.f{margin-bottom:12px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.new{background:#ffe8d1;color:#7c2d12}.drafted{background:#fef3c7;color:#713f12}.sent{background:#dcfce7;color:#14532d}
.failed{background:#fee2e2;color:#7f1d1d}.unsubscribed,.skipped{background:#e7e5e4;color:#292524}
.err{color:#7f1d1d;font-size:12px;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.bar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--ln)}
#send{bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 16px}
#send .btn{width:100%;min-height:52px;font-size:16px;border-radius:14px}
nav{bottom:0;display:flex;gap:4px;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-height:58px;border:0;border-radius:14px;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer}
nav button.on{background:var(--tile);color:var(--ac);font-weight:700}
nav svg,.logo svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px}
.logo{width:64px;height:64px;border-radius:20px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div id="login" hidden>
  <img src="/outreach-logo.svg" alt="Outreach" width="68" height="68" style="display:block;border-radius:18px;margin-bottom:20px;box-shadow:0 6px 18px rgba(194,65,12,0.22)">
  <h1 class="h" style="font-size:36px">Outreach</h1>
  <p class="mu" style="font-size:15px;margin:4px 0 28px">Sign in to review today's emails.</p>
  <div class="f"><label for="le">Email</label><input class="in" id="le" type="email" autocomplete="username" style="min-height:52px"></div>
  <div class="f"><label for="lp">Password</label><input class="in" id="lp" type="password" autocomplete="current-password" style="min-height:52px"></div>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn pri" id="lb" style="flex:none;width:100%;min-height:54px;font-size:16px;margin-top:10px">Sign in</button>
  <p class="mu" style="text-align:center;margin-top:18px;font-size:12px">Private app for one user. There is no sign-up.</p>
</div>

<div id="app" hidden>
<section id="s-drafts" class="on">
  <div class="hd"><div style="display:flex;align-items:center;gap:10px"><img src="/outreach-logo.svg" alt="" width="32" height="32" style="border-radius:8px"><h1 class="h" style="font-size:30px">Drafts</h1></div><button class="rf" aria-label="Refresh" title="Refresh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button></div>
  <div class="mu" id="today"></div>
  <div class="tiles"><div class="tile"><b id="n-ready">0</b><span>Ready</span></div><div class="tile"><b id="n-wait">0</b><span>Waiting</span></div><div class="tile"><b id="n-sent">0</b><span>Sent</span></div></div>
  <div class="row"><button class="btn" id="bfind">Find clients</button><button class="btn" id="bcsv">Import CSV</button></div>
  <div class="row"><button class="btn" id="bgen">Make drafts</button></div>
  <input type="file" id="csv" accept=".csv" hidden>
  <div id="drafts"></div>
</section>
<section id="s-sent">
  <div class="hd"><h1 class="h" style="font-size:30px">Sent</h1><button class="rf" aria-label="Refresh" title="Refresh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button></div>
  <div class="mu" id="sent-sub"></div>
  <div class="f" style="margin-top:14px"><label for="sq_sent" style="position:absolute;left:-9999px">Search sent</label><input class="in" id="sq_sent" placeholder="Search recipient or subject..." style="min-height:48px"></div>
  <div class="row" style="margin-top:8px" id="sent-f"><button class="btn on" data-f="all">All</button><button class="btn" data-f="sent">Sent</button><button class="btn" data-f="failed">Failed</button></div>
  <div id="sent"></div>
</section>
<section id="s-leads">
  <div class="hd"><h1 class="h" style="font-size:30px">Leads</h1><button class="rf" aria-label="Refresh" title="Refresh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button></div>
  <div class="mu" id="leads-sub"></div>
  <div class="f" style="margin-top:14px"><label for="q" style="position:absolute;left:-9999px">Search businesses</label><input class="in" id="q" placeholder="Search by name, email, city, category..." style="min-height:48px"></div>
  <div class="row" style="margin-top:8px;overflow-x:auto;padding-bottom:4px" id="leads-f">
    <button class="btn on" data-lf="all" style="flex:none;padding:0 14px">All</button>
    <button class="btn" data-lf="new" style="flex:none;padding:0 14px">Waiting</button>
    <button class="btn" data-lf="drafted" style="flex:none;padding:0 14px">Ready</button>
    <button class="btn" data-lf="sent" style="flex:none;padding:0 14px">Sent</button>
    <button class="btn" data-lf="failed" style="flex:none;padding:0 14px">Failed</button>
    <button class="btn" data-lf="unsubscribed" style="flex:none;padding:0 14px">Unsub</button>
  </div>
  <div id="leads"></div>
</section>
<section id="s-settings">
  <div class="hd"><h1 class="h" style="font-size:30px">Settings</h1><button class="rf" aria-label="Refresh" title="Refresh"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button></div>
  <div class="mu" style="margin-bottom:14px">What the app finds and sends</div>
  <div class="f">
    <label for="sq_sel">Business type to find</label>
    <select class="in" id="sq_sel"></select>
    <input class="in" id="sq_custom" placeholder="Type custom business type..." style="display:none;margin-top:6px">
  </div>
  <div class="f">
    <label for="s_country">Country</label>
    <select class="in" id="s_country"></select>
    <input class="in" id="s_country_custom" placeholder="Type custom country..." style="display:none;margin-top:6px">
  </div>
  <div class="row">
    <div class="f" style="flex:1">
      <label for="s_state">State / Province</label>
      <select class="in" id="s_state"></select>
      <input class="in" id="s_state_custom" placeholder="Type custom state..." style="display:none;margin-top:6px">
    </div>
    <div class="f" style="flex:1">
      <label for="s_city">City</label>
      <select class="in" id="s_city"></select>
      <input class="in" id="s_city_custom" placeholder="Type custom city..." style="display:none;margin-top:6px">
    </div>
  </div>
  <div class="row"><div class="f" style="flex:1"><label for="sd">Emails per day</label><input class="in" id="sd" type="number" min="1" max="30"></div><div class="f" style="flex:1"><label for="st">Send time</label><input class="in" id="st" type="time"></div></div>
  <div class="f"><label for="sn">Your name</label><input class="in" id="sn"></div>
  <div class="f"><label for="so">Company</label><input class="in" id="so"></div>
  <div class="f"><label for="sph">Phone number (in email footer)</label><input class="in" id="sph" placeholder="+91 97268 05104"></div>
  <div class="f"><label for="swb">Company website (in email footer)</label><input class="in" id="swb" placeholder="https://zynteqtechnologies.com"></div>
  <div class="f">
    <label for="sv_sel">Your service</label>
    <select class="in" id="sv_sel"></select>
    <textarea class="in" id="sv_custom" placeholder="Type custom service description..." style="display:none;margin-top:6px;min-height:90px"></textarea>
  </div>
  <button class="btn pri" id="bsave" style="flex:none;width:100%;min-height:52px;font-size:16px">Save settings</button>
  <p class="mu" style="font-size:12px">Your email password and API keys stay private on your server, never in the app.</p>
  <button class="btn" id="bout" style="flex:none;width:100%;margin-top:8px">Sign out</button>
</section>
<div class="bar" id="send"><button class="btn pri" id="bsend">Send all</button></div>
<nav class="bar" id="nav">
  <button data-t="drafts" class="on"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Drafts</button>
  <button data-t="sent"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>Sent</button>
  <button data-t="leads"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg>Leads</button>
  <button data-t="settings"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h5M15 6h5M4 12h9M19 12h1M4 18h3M13 18h7"/><circle cx="12" cy="6" r="2.2"/><circle cx="16" cy="12" r="2.2"/><circle cx="10" cy="18" r="2.2"/></svg>Settings</button>
</nav>
</div>
</div>
<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LABEL = { new: 'Waiting', drafted: 'Ready', sent: 'Sent', failed: 'Failed', unsubscribed: 'Unsubscribed', skipped: 'Skipped' };
let T = localStorage.getItem('t'), L = [], ST = {}, filt = 'all', busy = false;

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 3500); }
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + T }, body: body && JSON.stringify(body) });
  if (r.status === 401 && url !== '/api/login') { signOut(); throw new Error('signed out'); }
  return r.json();
}
function signOut() { localStorage.removeItem('t'); T = null; $('#app').hidden = true; $('#login').hidden = false; }

async function login() {
  $('#lerr').textContent = '';
  const r = await api('/api/login', 'POST', { email: $('#le').value, password: $('#lp').value });
  if (!r.token) { $('#lerr').textContent = r.error || 'Could not sign in'; return; }
  T = r.token; localStorage.setItem('t', T); $('#lp').value = ''; start();
}
async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#today').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  await refresh(); fillSettings(); tab('drafts');
}
async function refresh() { L = await api('/api/leads'); ST = await api('/api/settings'); render(); }
const count = (s) => L.filter((l) => l.status === s).length;
const chip = (s) => `<span class="chip ${s}">${LABEL[s] || s}</span>`;

function render() {
  const readyCount = L.filter((l) => ['drafted', 'failed'].includes(l.status) && l.body).length;
  $('#n-ready').textContent = readyCount; $('#n-wait').textContent = count('new'); $('#n-sent').textContent = count('sent');
  $('#bsend').textContent = readyCount ? `Send all ${readyCount} emails` : 'Send all';
  const d = L.filter((l) => ['drafted', 'failed'].includes(l.status));
  $('#drafts').innerHTML = d.length ? d.map((l) => `<div class="card"><div class="top"><div><h3>${esc(l.name || l.email)}</h3><div class="mu">${esc(l.email)}${l.city ? ' · ' + esc(l.city) : ''}</div></div>${chip(l.status)}</div>
    ${l.error ? `<div class="err">${esc(l.error)}</div>` : ''}
    <textarea class="in" style="min-height:46px;height:46px;margin-top:10px;padding-top:11px" aria-label="Subject" onchange="edit('${esc(l.id)}',{subject:this.value})">${esc(l.subject)}</textarea>
    <textarea class="in" aria-label="Message" onchange="edit('${esc(l.id)}',{body:this.value})">${esc(l.body)}</textarea>
    <div style="margin-top:8px;padding:10px 12px;background:var(--tile);border-radius:10px;font-size:12px;color:var(--tx);line-height:1.5;border:1px dashed var(--ln)">
      <div style="font-weight:700;margin-bottom:4px;color:var(--ac)">✉️ Email Footer (sent with email):</div>
      --<br>
      <b>${esc(ST.name || 'Zahid')}</b><br>
      <b>${esc(ST.company || 'Zynteq Technologies')}</b><br>
      ${ST.phone ? `📞 Phone: <b>${esc(ST.phone)}</b><br>` : ''}
      🌐 Website: <a href="${esc(ST.website || 'https://zynteqtechnologies.com')}" target="_blank" style="color:var(--ac);font-weight:600">${esc(ST.website || 'https://zynteqtechnologies.com')}</a><br>
      <span style="color:var(--mu);font-size:11px;margin-top:2px;display:inline-block">If you'd rather not hear from us, just reply "unsubscribe" and we won't email you again.</span>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px">
      ${l.status === 'failed' ? `<button class="btn sm" onclick="setStatus('${esc(l.id)}','drafted')">Reset</button>` : ''}
      <button class="btn sm" onclick="setStatus('${esc(l.id)}','skipped')">Discard</button>
    </div></div>`).join('')
    : '<div class="empty">No drafts yet.<br>Tap “Find clients”, then “Make drafts”.</div>';
  const sqSent = ($('#sq_sent') ? $('#sq_sent').value : '').trim().toLowerCase();
  const s = L.filter((l) => ['sent', 'failed'].includes(l.status) &&
    (filt === 'all' || l.status === filt) &&
    (!sqSent || (l.name + ' ' + l.email + ' ' + (l.subject || '')).toLowerCase().includes(sqSent))
  ).sort((a, b) => String(b.sentAt || '').localeCompare(String(a.sentAt || '')));

  $('#sent-sub').textContent = `${count('sent')} sent · ${count('failed')} failed`;
  $('#sent').innerHTML = s.length ? s.map((l) => `
    <div class="card">
      <div class="top">
        <div>
          <h3>${esc(l.name || l.email)}</h3>
          <div class="mu">
            To: <a href="mailto:${esc(l.email)}" style="color:inherit;font-weight:600">${esc(l.email)}</a>
            ${l.city ? ' · 📍 ' + esc(l.city) : ''}
          </div>
          ${l.sentAt ? `<div class="mu" style="font-size:12px;margin-top:2px">📅 Sent: ${new Date(l.sentAt).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>` : ''}
        </div>
        ${chip(l.status)}
      </div>
      ${l.error ? `<div class="err" style="background:#fee2e2;padding:6px 10px;border-radius:8px;margin-top:8px">⚠️ <b>Failed reason:</b> ${esc(l.error)}</div>` : ''}
      ${l.subject ? `
        <div style="margin-top:10px;padding:10px;background:var(--tile);border-radius:10px">
          <div style="font-weight:700;font-size:13px;color:var(--tx);margin-bottom:4px">Subject: ${esc(l.subject)}</div>
          <div style="font-size:13px;line-height:1.45;color:var(--tx);white-space:pre-wrap;max-height:130px;overflow-y:auto">${esc(l.body)}</div>
        </div>
      ` : ''}
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        ${l.status === 'failed' ? `<button class="btn sm" onclick="setStatus('${esc(l.id)}','drafted');toast('Moved back to Drafts')">Retry Send</button>` : ''}
        ${l.website ? `<a class="btn sm" href="${/^https?:/.test(l.website) ? esc(l.website) : 'https://' + esc(l.website)}" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center">🌐 Website</a>` : ''}
      </div>
    </div>
  `).join('') : '<div class="empty">No sent emails found.</div>';

  const leadFilt = window.leadFilt || 'all';
  const q = ($('#q') ? $('#q').value : '').trim().toLowerCase();
  const ls = L.filter((l) =>
    (leadFilt === 'all' || l.status === leadFilt) &&
    (!q || (l.name + ' ' + l.email + ' ' + (l.city || '') + ' ' + (l.category || '') + ' ' + (l.notes || '')).toLowerCase().includes(q))
  );

  $('#leads-sub').textContent = `${L.length} total businesses (${count('new')} waiting, ${count('drafted')} ready, ${count('sent')} sent)`;
  $('#leads').innerHTML = ls.length ? ls.map((l) => `
    <div class="card">
      <div class="top">
        <div>
          <h3>${esc(l.name || l.email)}</h3>
          <div class="mu">
            <a href="mailto:${esc(l.email)}" style="color:inherit;font-weight:600">${esc(l.email)}</a>
            ${l.city ? ' · 📍 ' + esc(l.city) : ''}
          </div>
          ${l.category ? `<div style="font-size:12px;color:var(--ac);font-weight:600;margin-top:2px">🏷️ ${esc(l.category)}</div>` : ''}
        </div>
        ${chip(l.status)}
      </div>

      ${l.notes ? `<div class="mu" style="font-size:13px;margin-top:8px;background:var(--bg);padding:8px 10px;border-radius:8px">💡 <b>Opportunity:</b> ${esc(l.notes)}</div>` : ''}

      ${l.subject ? `
        <div style="margin-top:8px;padding:8px 10px;background:var(--tile);border-radius:8px;font-size:13px">
          <b>Subject:</b> ${esc(l.subject)}
        </div>
      ` : ''}

      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${l.website ? `<a class="btn sm" href="${/^https?:/.test(l.website) ? esc(l.website) : 'https://' + esc(l.website)}" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center">🌐 Visit Site</a>` : ''}
        ${l.status === 'new' ? `<button class="btn sm pri" onclick="setStatus('${esc(l.id)}','drafted');toast('Ready to write draft')">Draft Email</button>` : ''}
        ${['drafted', 'failed'].includes(l.status) ? `<button class="btn sm" onclick="tab('drafts')">View in Drafts</button>` : ''}
        ${l.status === 'unsubscribed' ? `<button class="btn sm" onclick="setStatus('${esc(l.id)}','new')">Restore</button>` : `<button class="btn sm" onclick="setStatus('${esc(l.id)}','unsubscribed')">Unsubscribe</button>`}
      </div>
    </div>
  `).join('') : '<div class="empty">No businesses match your filter.</div>';
}

function initDropdowns() {
  const sqSel = $('#sq_sel');
  sqSel.innerHTML = CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('') +
    `<option value="__custom__">➕ Add custom business type...</option>`;
  sqSel.onchange = () => {
    const isCust = sqSel.value === '__custom__';
    $('#sq_custom').style.display = isCust ? 'block' : 'none';
    if (isCust) $('#sq_custom').focus();
  };

  const svSel = $('#sv_sel');
  svSel.innerHTML = SERVICES.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('') +
    `<option value="__custom__">➕ Add custom service...</option>`;
  svSel.onchange = () => {
    const isCust = svSel.value === '__custom__';
    $('#sv_custom').style.display = isCust ? 'block' : 'none';
    if (isCust) $('#sv_custom').focus();
  };

  const sCountry = $('#s_country');
  sCountry.innerHTML = Object.keys(GEO).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('') +
    `<option value="__custom__">➕ Other country...</option>`;
  sCountry.onchange = () => updateStates();
}

function updateStates(prefState, prefCity) {
  const cVal = $('#s_country').value;
  const isCustCountry = cVal === '__custom__';
  $('#s_country_custom').style.display = isCustCountry ? 'block' : 'none';
  if (isCustCountry) {
    $('#s_state').style.display = 'none';
    $('#s_state_custom').style.display = 'block';
    $('#s_city').style.display = 'none';
    $('#s_city_custom').style.display = 'block';
    return;
  }
  $('#s_state').style.display = 'block';
  $('#s_city').style.display = 'block';

  const states = GEO[cVal] ? Object.keys(GEO[cVal]) : [];
  const sState = $('#s_state');
  sState.innerHTML = states.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('') +
    `<option value="__custom__">➕ Other state...</option>`;

  if (prefState && states.includes(prefState)) {
    sState.value = prefState;
    $('#s_state_custom').style.display = 'none';
  } else if (prefState) {
    sState.value = '__custom__';
    $('#s_state_custom').value = prefState;
    $('#s_state_custom').style.display = 'block';
  } else {
    $('#s_state_custom').style.display = 'none';
  }

  sState.onchange = () => {
    const isCustState = sState.value === '__custom__';
    $('#s_state_custom').style.display = isCustState ? 'block' : 'none';
    if (isCustState) {
      $('#s_city').style.display = 'none';
      $('#s_city_custom').style.display = 'block';
    } else {
      $('#s_city').style.display = 'block';
      updateCities();
    }
  };

  updateCities(prefCity);
}

function updateCities(prefCity) {
  const cVal = $('#s_country').value;
  const sVal = $('#s_state').value;
  if (cVal === '__custom__' || sVal === '__custom__') {
    $('#s_city').style.display = 'none';
    $('#s_city_custom').style.display = 'block';
    return;
  }
  $('#s_city').style.display = 'block';
  const cities = (GEO[cVal] && GEO[cVal][sVal]) || [];
  const sCity = $('#s_city');
  sCity.innerHTML = cities.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('') +
    `<option value="__custom__">➕ Other city...</option>`;

  if (prefCity && cities.includes(prefCity)) {
    sCity.value = prefCity;
    $('#s_city_custom').style.display = 'none';
  } else if (prefCity) {
    sCity.value = '__custom__';
    $('#s_city_custom').value = prefCity;
    $('#s_city_custom').style.display = 'block';
  } else {
    $('#s_city_custom').style.display = 'none';
  }

  sCity.onchange = () => {
    const isCust = sCity.value === '__custom__';
    $('#s_city_custom').style.display = isCust ? 'block' : 'none';
    if (isCust) $('#s_city_custom').focus();
  };
}

function fillSettings() {
  if (!$('#sq_sel').options.length) initDropdowns();

  const q = ST.query || 'Dental Clinic';
  const matchCat = CATEGORIES.find((c) => c.toLowerCase() === q.toLowerCase());
  if (matchCat) {
    $('#sq_sel').value = matchCat;
    $('#sq_custom').style.display = 'none';
  } else {
    $('#sq_sel').value = '__custom__';
    $('#sq_custom').value = q;
    $('#sq_custom').style.display = 'block';
  }

  const sv = ST.service || '';
  const matchSv = SERVICES.find((s) => s.toLowerCase() === sv.toLowerCase());
  if (matchSv) {
    $('#sv_sel').value = matchSv;
    $('#sv_custom').style.display = 'none';
  } else if (sv) {
    $('#sv_sel').value = '__custom__';
    $('#sv_custom').value = sv;
    $('#sv_custom').style.display = 'block';
  } else {
    $('#sv_sel').value = SERVICES[0];
    $('#sv_custom').style.display = 'none';
  }

  const country = ST.country || 'India';
  const state = ST.state || 'Gujarat';
  const city = ST.city || 'Vadodara';

  if (GEO[country]) {
    $('#s_country').value = country;
    $('#s_country_custom').style.display = 'none';
    updateStates(state, city);
  } else {
    $('#s_country').value = '__custom__';
    $('#s_country_custom').value = country;
    $('#s_country_custom').style.display = 'block';
    $('#s_state').style.display = 'none';
    $('#s_state_custom').value = state;
    $('#s_state_custom').style.display = 'block';
    $('#s_city').style.display = 'none';
    $('#s_city_custom').value = city;
    $('#s_city_custom').style.display = 'block';
  }

  $('#sd').value = ST.daily || 10;
  $('#st').value = ST.time || '10:00';
  $('#sn').value = ST.name || 'Zahid';
  $('#so').value = ST.company || 'Zynteq Technologies';
  $('#sph').value = ST.phone || '';
  $('#swb').value = ST.website || 'https://zynteqtechnologies.com';
}

async function saveSettings() {
  const query = $('#sq_sel').value === '__custom__' ? $('#sq_custom').value.trim() : $('#sq_sel').value;
  const country = $('#s_country').value === '__custom__' ? $('#s_country_custom').value.trim() : $('#s_country').value;
  const state = ($('#s_state').style.display === 'none' || $('#s_state').value === '__custom__') ? $('#s_state_custom').value.trim() : $('#s_state').value;
  const city = ($('#s_city').style.display === 'none' || $('#s_city').value === '__custom__') ? $('#s_city_custom').value.trim() : $('#s_city').value;
  const service = $('#sv_sel').value === '__custom__' ? $('#sv_custom').value.trim() : $('#sv_sel').value;

  ST = await api('/api/settings', 'PUT', {
    query, country, state, city, service,
    daily: $('#sd').value,
    time: $('#st').value,
    name: $('#sn').value,
    company: $('#so').value,
    phone: $('#sph').value.trim(),
    website: $('#swb').value.trim(),
  });
  fillSettings();
  toast('Settings saved');
}

async function run(btn, label, fn) {
  if (busy) return; busy = true; const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { await fn(); } catch (e) { if (e.message !== 'signed out') toast('Something went wrong. Try again.'); }
  busy = false; btn.disabled = false; btn.textContent = old; if (T) await refresh();
}

$('#bsend').onclick = () => {
  const n = L.filter((l) => ['drafted', 'failed'].includes(l.status) && l.body).length;
  if (!n) return toast('No drafts to send');
  if (!confirm(`Send ${n} emails now?`)) return;
  run($('#bsend'), 'Sending... keep this open', async () => { const r = await api('/api/send-all', 'POST'); toast(`Sent ${r.sent}, failed ${r.failed}`); });
};
function parseCSV(t) {
  const rows = []; let row = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(c); c = ''; }
    else if (ch === '\n') { row.push(c); rows.push(row); row = []; c = ''; }
    else if (ch !== '\r') c += ch;
  }
  if (c || row.length) { row.push(c); rows.push(row); }
  const h = rows.shift().map((x) => x.trim().toLowerCase());
  return rows.map((r) => Object.fromEntries(h.map((k, i) => [k, (r[i] || '').trim()])));
}
$('#bcsv').onclick = () => $('#csv').click();
$('#csv').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = await api('/api/import', 'POST', { rows: parseCSV(await f.text()) });
  e.target.value = ''; toast(`${r.added} new leads added`); refresh();
};
function tab(t) {
  document.querySelectorAll('section').forEach((s) => s.classList.toggle('on', s.id === 's-' + t));
  document.querySelectorAll('#nav button').forEach((b) => { b.classList.toggle('on', b.dataset.t === t); b.setAttribute('aria-current', b.dataset.t === t ? 'page' : 'false'); });
  $('#send').hidden = t !== 'drafts'; window.scrollTo(0, 0);
}

document.querySelectorAll('#leads-f button').forEach((b) => (b.onclick = () => { window.leadFilt = b.dataset.lf; document.querySelectorAll('#leads-f button').forEach((x) => x.classList.toggle('on', x === b)); render(); }));

async function reload(btn) {
  if (btn.classList.contains('spin')) return;
  btn.classList.add('spin');
  try { await refresh(); if ($('#s-settings').classList.contains('on')) fillSettings(); toast('Updated'); }
  catch (e) { if (e.message !== 'signed out') toast("Couldn't refresh. Check your connection."); }
  btn.classList.remove('spin');
}
